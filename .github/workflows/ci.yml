name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint, and APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CORE_SUBMODULE_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Android Lint
        run: ./gradlew lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK (every push to main and every PR)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK (tags only, when signing secrets exist)
        if: startsWith(github.ref, 'refs/tags/v') && env.KS_B64 != ''
        env:
          KS_B64: ${{ secrets.CSAPP_KEYSTORE_B64 }}
          CSAPP_KEYSTORE_PASSWORD: ${{ secrets.CSAPP_KEYSTORE_PASSWORD }}
          CSAPP_KEY_ALIAS: ${{ secrets.CSAPP_KEY_ALIAS }}
          CSAPP_KEY_PASSWORD: ${{ secrets.CSAPP_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export CSAPP_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --console=plain

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KS_B64 != ''
        env:
          KS_B64: ${{ secrets.CSAPP_KEYSTORE_B64 }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
