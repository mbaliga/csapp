name: Materialize and build V1

on:
  push:
    branches:
      - agent/private-dogfood-v1
    paths:
      - source.tar.gz
      - .github/workflows/bootstrap-v1.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csapp-private-dogfood-v1
  cancel-in-progress: false

jobs:
  materialize-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Materialize checked source tree
        shell: bash
        run: |
          set -euo pipefail
          echo "db120caa127a6502bd78d6af440db61aa1f69ed0faf3279a11dc0413e089296c  source.tar.gz" | sha256sum --check --strict
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name source.tar.gz -exec rm -rf {} +
          tar -xzf source.tar.gz -C .
          rm -f source.tar.gz .github/workflows/bootstrap-v1.yml
          sed -i 's/agp = "9.3.0"/agp = "9.2.1"/' gradle/libs.versions.toml
          sed -i 's/gradle-9.5.0-bin.zip/gradle-9.4.1-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/Gradle 9.5/Gradle 9.4.1/g; s/gradle-version: "9.5.0"/gradle-version: "9.4.1"/g' README.md .github/workflows/android-ci.yml
          gradle wrapper --gradle-version 9.4.1 --distribution-type bin
          chmod +x gradlew

      - name: Publish readable source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build private dogfood V1"
          git push origin HEAD:agent/private-dogfood-v1

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon test assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Runtime dependency report
        if: always()
        shell: bash
        run: |
          mkdir -p build
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > build/runtime-dependencies.txt || true

      - name: Upload V1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csapp-private-dogfood-v1
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/reports/**
            build/runtime-dependencies.txt
          if-no-files-found: warn
