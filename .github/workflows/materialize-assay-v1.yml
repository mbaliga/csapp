name: Recover and build csapp V1

on:
  push:
    branches: ["agent/cs-app-v1"]
    paths: [".github/workflows/materialize-assay-v1.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and verify readable csapp source
        shell: bash
        run: |
          set -euo pipefail
          source_commit=96be32f3aa40adeb0672f2c084d0f5548f887f7a
          source_blob=64af4dae7dcb066f88b0b7b499e2c1c6f5c7ae1b
          git show "${source_commit}:source.tar.gz" > /tmp/csapp-source.tar.gz
          test "$(git hash-object /tmp/csapp-source.tar.gz)" = "$source_blob"

          set +e
          gzip -dc /tmp/csapp-source.tar.gz > /tmp/csapp-source.tar 2> /tmp/gzip-recovery.txt
          gzip_status=$?
          tar --ignore-zeros -tf /tmp/csapp-source.tar > /tmp/tar-list.txt 2> /tmp/tar-list-error.txt
          list_status=$?
          set -e
          echo "gzip recovery status: $gzip_status"
          echo "tar listing status: $list_status"
          wc -c /tmp/csapp-source.tar.gz /tmp/csapp-source.tar

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          set +e
          tar --ignore-zeros -xf /tmp/csapp-source.tar -C . 2> /tmp/tar-extract-error.txt
          extract_status=$?
          set -e
          echo "tar extraction status: $extract_status"

          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f tools/verify_source.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          text_extensions = {'.kt', '.kts', '.xml', '.md', '.json', '.properties', '.yml', '.yaml', '.txt', '.pro'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in text_extensions:
                  continue
              text = path.read_text(errors='strict')
              updated = text.replace('Fonebrew Signals', 'csapp').replace('CS App', 'csapp').replace('Assay', 'csapp')
              if updated != text:
                  path.write_text(updated)

          settings = Path('settings.gradle.kts')
          settings_text = settings.read_text()
          settings_text = re.sub(r'rootProject\.name\s*=\s*"[^"]+"', 'rootProject.name = "csapp"', settings_text, count=1)
          settings.write_text(settings_text)

          patches = [
              (Path('app/src/main/kotlin/dev/fonebrew/cs/MainActivity.kt'), 'import androidx.lifecycle.viewModels\n', 'import androidx.lifecycle.viewModels\nimport androidx.lifecycle.lifecycleScope\n', 'lifecycleScope'),
              (Path('app/src/main/kotlin/dev/fonebrew/cs/WorkScheduling.kt'), 'import java.util.concurrent.TimeUnit\n', 'import java.util.concurrent.TimeUnit\nimport kotlinx.coroutines.launch\n', 'launch {'),
              (Path('app/src/test/kotlin/dev/fonebrew/cs/CoordinatorInvariantTest.kt'), 'import dev.fonebrew.cs.triage.TriageService\n', 'import dev.fonebrew.cs.triage.TriageService\nimport kotlinx.coroutines.flow.first\n', '.first()'),
          ]
          for path, anchor, replacement, usage in patches:
              if not path.exists():
                  continue
              text = path.read_text()
              imported = replacement.splitlines()[-1]
              if usage in text and imported not in text:
                  if anchor not in text:
                      raise SystemExit(f'Expected import anchor missing in {path}')
                  path.write_text(text.replace(anchor, replacement, 1))
          PY

          rm -rf bootstrap bootstrap-code bootstrap-v1 transport transport2
          rm -f source.tar.gz bootstrap.part-* bootstrap.payload.*
          rm -f .github/workflows/bootstrap-v1.yml .github/workflows/recover-v1.yml .github/workflows/materialize-pr.yml .github/workflows/finalize-v1.yml .github/workflows/materialize-assay-v1.yml
          chmod +x gradlew tools/*.sh
          mkdir -p build/recovery
          cp /tmp/gzip-recovery.txt /tmp/tar-list.txt /tmp/tar-list-error.txt /tmp/tar-extract-error.txt build/recovery/
          grep -Fq 'rootProject.name = "csapp"' settings.gradle.kts
          grep -Fq 'android:label="csapp"' app/src/main/AndroidManifest.xml
          python3 tools/verify_source.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install canonical Gradle wrapper
        run: |
          tools/install_canonical_wrapper.sh
          ./gradlew --version

      - name: Test, assemble, lint, and verify licences
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon \
            :core-model:test \
            :loop:test \
            :triage:test \
            :export:test \
            :connectors:testDebugUnitTest \
            :core-data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            licenseCheck \
            --stacktrace 2>&1 | tee build/final-verification.log
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee build/csapp-v1-debug.sha256

      - name: Commit readable verified source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build csapp private dogfood V1"
          git push origin HEAD:agent/cs-app-v1

      - name: Upload csapp build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csapp-v1-build-evidence
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            **/build/test-results/**
            build/final-verification.log
            build/csapp-v1-debug.sha256
            build/recovery/**
          if-no-files-found: warn
