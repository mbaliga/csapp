name: Materialize csapp V1

on:
  push:
    branches: ["agent/cs-app-v1"]
    paths: [".github/workflows/materialize-assay-v1.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout branch and source transport
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract csapp source
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            transport/csapp-xz-00
            transport/csapp-xz-01
            transport/csapp-xz-02
            transport/csapp-xz-03
            transport/csapp-xz-04
            transport/csapp-xz-05
            transport/csapp-xz-06
          )
          for part in "${parts[@]}"; do
            test -f "$part"
          done
          cat "${parts[@]}" > /tmp/csapp-v1.tar.xz.b64
          test "$(wc -c < /tmp/csapp-v1.tar.xz.b64)" -eq 97504
          echo "efb889d0559970e46bab11b4d824d83d1acfc059080ff00683df7789a4875280  /tmp/csapp-v1.tar.xz.b64" | sha256sum --check --strict
          base64 --decode /tmp/csapp-v1.tar.xz.b64 > /tmp/csapp-v1.tar.xz
          test "$(wc -c < /tmp/csapp-v1.tar.xz)" -eq 73128
          echo "86e26ab0630149985223960aa116dfcbe7abf6e9a23b8b93a8f2a54871dc2456  /tmp/csapp-v1.tar.xz" | sha256sum --check --strict
          xz --test /tmp/csapp-v1.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/csapp-v1.tar.xz -C .
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f tools/verify_source.py
          grep -Fq 'rootProject.name = "csapp"' settings.gradle.kts
          grep -Fq 'android:label="csapp"' app/src/main/AndroidManifest.xml
          chmod +x gradlew tools/*.sh
          python3 tools/verify_source.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install and verify canonical Gradle wrapper
        run: |
          tools/install_canonical_wrapper.sh
          ./gradlew --version

      - name: Verify source contracts
        run: python3 tools/verify_source.py

      - name: Test, assemble, lint, and verify licences
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew --no-daemon \
            :core-model:test \
            :loop:test \
            :triage:test \
            :export:test \
            :connectors:testDebugUnitTest \
            :core-data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            licenseCheck \
            --stacktrace 2>&1 | tee build/final-verification.log
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee build/csapp-v1-debug.sha256

      - name: Commit readable verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build csapp private dogfood V1"
          git push origin HEAD:agent/cs-app-v1

      - name: Upload csapp APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csapp-v1-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            **/build/test-results/**
            build/final-verification.log
            build/csapp-v1-debug.sha256
          if-no-files-found: warn
