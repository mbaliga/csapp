name: Materialize Assay V1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: assay-v1-materialize
  cancel-in-progress: true

jobs:
  materialize-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/cs-app-v1

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            transport/assay-part-00
            transport/assay-part-01
            transport/assay-part-03
            transport/assay-part-04
            transport/assay-part-05
            transport/assay-part-06
            transport/assay-part-07a
            transport/assay-part-07b
            transport/assay-part-08a
            transport/assay-part-08b
            transport/assay-part-09
          )
          for part in "${parts[@]}"; do test -f "$part"; done
          cat "${parts[@]}" > /tmp/assay-v1-source.b64
          test "$(wc -c < /tmp/assay-v1-source.b64)" -eq 123900
          echo "75ff99afbba1a282dd191f6b619f3844e71d91b930e488bd0ff66eb0ac0388e9  /tmp/assay-v1-source.b64" | sha256sum --check --strict
          base64 --decode /tmp/assay-v1-source.b64 > /tmp/assay-v1-source.tar.gz
          echo "2de0f7a64062122fda14c5ea70be3faf58318e09a46f1d9d1566b177bbc81849  /tmp/assay-v1-source.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/assay-v1-source.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/assay-v1-source.tar.gz -C .
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f tools/verify_source.py
          grep -q 'android:label="Assay"' app/src/main/AndroidManifest.xml

      - name: Install final Android CI workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          name: Android CI

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main, "agent/cs-app-v1"]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 60
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"
                - uses: android-actions/setup-android@v3
                - name: Install pinned Android SDK
                  run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
                - uses: gradle/actions/setup-gradle@v4
                - name: Ensure executable scripts
                  run: chmod +x gradlew tools/*.sh
                - name: Verify Gradle wrapper
                  run: ./gradlew --version
                - name: Verify source contracts
                  run: python3 tools/verify_source.py
                - name: Unit tests and debug APK
                  run: >-
                    ./gradlew
                    :core-model:test
                    :loop:test
                    :triage:test
                    :export:test
                    :connectors:testDebugUnitTest
                    :core-data:testDebugUnitTest
                    :app:testDebugUnitTest
                    :app:assembleDebug
                    --stacktrace
                    --no-daemon
                - name: Android lint
                  run: ./gradlew :app:lintDebug --stacktrace --no-daemon
                - name: License gate
                  run: ./gradlew licenseCheck --stacktrace --no-daemon
                - name: APK checksum
                  run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee build/assay-v1-debug.sha256
                - name: Upload verified APK and reports
                  uses: actions/upload-artifact@v4
                  with:
                    name: assay-v1-debug-${{ github.sha }}
                    path: |
                      app/build/outputs/apk/debug/app-debug.apk
                      app/build/reports/lint-results-debug.html
                      **/build/test-results/**
                      build/assay-v1-debug.sha256
                    if-no-files-found: error
          YAML
          chmod +x gradlew tools/*.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install canonical Gradle wrapper
        run: tools/install_canonical_wrapper.sh

      - name: Verify wrapper and source contracts
        run: |
          ./gradlew --version
          python3 tools/verify_source.py

      - name: Test, assemble, lint, and verify licenses
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew --no-daemon \
            :core-model:test \
            :loop:test \
            :triage:test \
            :export:test \
            :connectors:testDebugUnitTest \
            :core-data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            licenseCheck \
            --stacktrace 2>&1 | tee build/final-verification.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee build/assay-v1-debug.sha256

      - name: Commit readable verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Assay private dogfood V1"
          git push origin HEAD:agent/cs-app-v1

      - name: Upload verified APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: assay-v1-materialized
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            **/build/test-results/**
            build/final-verification.log
            build/assay-v1-debug.sha256
          if-no-files-found: error
