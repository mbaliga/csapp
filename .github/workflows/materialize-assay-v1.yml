name: Materialize Assay V1

on:
  push:
    branches: ["agent/cs-app-v1"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch and source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover immutable source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=96be32f3aa40adeb0672f2c084d0f5548f887f7a
          SOURCE_BLOB=64af4dae7dcb066f88b0b7b499e2c1c6f5c7ae1b
          git cat-file -e "${SOURCE_COMMIT}:source.tar.gz"
          git show "${SOURCE_COMMIT}:source.tar.gz" > /tmp/assay-source.b64
          test "$(git hash-object /tmp/assay-source.b64)" = "$SOURCE_BLOB"
          base64 --decode /tmp/assay-source.b64 > /tmp/assay-source.tar.gz
          gzip --test /tmp/assay-source.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/assay-source.tar.gz -C .
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f tools/verify_source.py

      - name: Standardize Assay product identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('app/src/main/AndroidManifest.xml'): [('Fonebrew Signals', 'Assay')],
              Path('app/src/main/kotlin/dev/fonebrew/cs/CsUi.kt'): [('Fonebrew Signals', 'Assay')],
              Path('README.md'): [('# Fonebrew Signals', '# Assay'), ('**Fonebrew Signals**', '**Assay**')],
              Path('.github/workflows/ci.yml'): [('fonebrew-signals-debug', 'assay-debug')],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          chmod +x gradlew tools/*.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install and verify canonical Gradle wrapper
        run: tools/install_canonical_wrapper.sh

      - name: Verify source contracts
        run: python3 tools/verify_source.py

      - name: Run unit tests and assemble APK
        run: >-
          ./gradlew
          :core-model:test
          :loop:test
          :triage:test
          :export:test
          :connectors:testDebugUnitTest
          :core-data:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          --stacktrace
          --no-daemon

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Run license gate
        run: ./gradlew licenseCheck --stacktrace --no-daemon

      - name: Commit readable verified source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Assay private dogfood V1"
          git push origin HEAD:agent/cs-app-v1

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: assay-v1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
