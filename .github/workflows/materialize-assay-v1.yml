name: Materialize Assay V1

on:
  push:
    branches: ["agent/cs-app-v1"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch and recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover commit-pinned source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=3d9d0ce53d8894d3e8d2f4ddfa02409e5742b760
          for part in part-00 part-01 part-02 part-03 part-04 part-05 part-06 part-07; do
            git show "${SOURCE_COMMIT}:bootstrap-v1/${part}"
          done | base64 --decode > /tmp/assay-v1-source.tar.xz
          xz --test /tmp/assay-v1-source.tar.xz
          sha256sum /tmp/assay-v1-source.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/assay-v1-source.tar.xz -C .
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f tools/verify_source.py

      - name: Apply verified compile corrections and Assay identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          patches = [
              (Path('app/src/main/kotlin/dev/fonebrew/cs/MainActivity.kt'), 'import androidx.lifecycle.viewModels\n', 'import androidx.lifecycle.viewModels\nimport androidx.lifecycle.lifecycleScope\n'),
              (Path('app/src/main/kotlin/dev/fonebrew/cs/WorkScheduling.kt'), 'import java.util.concurrent.TimeUnit\n', 'import java.util.concurrent.TimeUnit\nimport kotlinx.coroutines.launch\n'),
              (Path('app/src/test/kotlin/dev/fonebrew/cs/CoordinatorInvariantTest.kt'), 'import dev.fonebrew.cs.triage.TriageService\n', 'import dev.fonebrew.cs.triage.TriageService\nimport kotlinx.coroutines.flow.first\n'),
          ]
          for path, needle, replacement in patches:
              text = path.read_text()
              if replacement not in text:
                  if needle not in text:
                      raise SystemExit(f'Expected import anchor not found in {path}')
                  path.write_text(text.replace(needle, replacement, 1))

          replacements = {
              Path('app/src/main/AndroidManifest.xml'): [('Fonebrew Signals', 'Assay')],
              Path('app/src/main/kotlin/dev/fonebrew/cs/CsUi.kt'): [('Fonebrew Signals', 'Assay')],
              Path('README.md'): [('# Fonebrew Signals', '# Assay'), ('**Fonebrew Signals**', '**Assay**')],
              Path('.github/workflows/ci.yml'): [('fonebrew-signals-debug', 'assay-debug')],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          rm -rf bootstrap bootstrap-code bootstrap-v1
          rm -f source.tar.gz bootstrap.part-* bootstrap.payload.*
          rm -f .github/workflows/bootstrap-v1.yml .github/workflows/recover-v1.yml .github/workflows/materialize-pr.yml .github/workflows/finalize-v1.yml .github/workflows/materialize-assay-v1.yml
          chmod +x gradlew tools/*.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install and verify canonical Gradle wrapper
        run: tools/install_canonical_wrapper.sh

      - name: Verify source contracts
        run: python3 tools/verify_source.py

      - name: Run unit tests and assemble APK
        run: >-
          ./gradlew
          :core-model:test
          :loop:test
          :triage:test
          :export:test
          :connectors:testDebugUnitTest
          :core-data:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          --stacktrace
          --no-daemon

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Run license gate
        run: ./gradlew licenseCheck --stacktrace --no-daemon

      - name: Commit readable verified source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Assay private dogfood V1"
          git push origin HEAD:agent/cs-app-v1

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: assay-v1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
