name: Materialize Assay V1

on:
  push:
    branches: ["agent/cs-app-v1"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch and recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover immutable source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=96be32f3aa40adeb0672f2c084d0f5548f887f7a
          SOURCE_BLOB=64af4dae7dcb066f88b0b7b499e2c1c6f5c7ae1b
          git show "${SOURCE_COMMIT}:source.tar.gz" > /tmp/assay-source.encoded
          test "$(git hash-object /tmp/assay-source.encoded)" = "$SOURCE_BLOB"
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          raw = Path('/tmp/assay-source.encoded').read_bytes()
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          clean += b'=' * (-len(clean) % 4)
          decoded = base64.b64decode(clean, validate=False)
          Path('/tmp/assay-source.tar.gz').write_bytes(decoded)
          PY
          gzip --test /tmp/assay-source.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/assay-source.tar.gz -C .
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f tools/verify_source.py

      - name: Standardize Assay identity and remove delivery debris
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          optional_imports = [
              (root / 'app/src/main/kotlin/dev/fonebrew/cs/MainActivity.kt', 'import androidx.lifecycle.viewModels\n', 'import androidx.lifecycle.viewModels\nimport androidx.lifecycle.lifecycleScope\n', 'lifecycleScope'),
              (root / 'app/src/main/kotlin/dev/fonebrew/cs/WorkScheduling.kt', 'import java.util.concurrent.TimeUnit\n', 'import java.util.concurrent.TimeUnit\nimport kotlinx.coroutines.launch\n', 'launch {'),
          ]
          for path, anchor, replacement, usage in optional_imports:
              if not path.exists():
                  continue
              text = path.read_text()
              imported = replacement.splitlines()[-1]
              if usage in text and imported not in text:
                  if anchor not in text:
                      raise SystemExit(f'Expected import anchor not found in {path}')
                  path.write_text(text.replace(anchor, replacement, 1))

          replacements = {
              root / 'app/src/main/AndroidManifest.xml': [('Fonebrew Signals', 'Assay'), ('CS App', 'Assay')],
              root / 'app/src/main/kotlin/dev/fonebrew/cs/CsUi.kt': [('Fonebrew Signals', 'Assay'), ('CS App', 'Assay')],
              root / 'README.md': [('# Fonebrew Signals', '# Assay'), ('# CS App', '# Assay'), ('**Fonebrew Signals**', '**Assay**'), ('**CS App**', '**Assay**')],
              root / '.github/workflows/ci.yml': [('fonebrew-signals-debug', 'assay-debug'), ('cs-app-private-dogfood-v1', 'assay-v1-debug')],
          }
          for path, pairs in replacements.items():
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          rm -rf bootstrap bootstrap-code bootstrap-v1 transport
          rm -f source.tar.gz bootstrap.part-* bootstrap.payload.*
          rm -f .github/workflows/bootstrap-v1.yml .github/workflows/recover-v1.yml .github/workflows/materialize-pr.yml .github/workflows/finalize-v1.yml .github/workflows/materialize-assay-v1.yml
          chmod +x gradlew tools/*.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install and verify canonical Gradle wrapper
        run: tools/install_canonical_wrapper.sh

      - name: Verify source contracts
        run: python3 tools/verify_source.py

      - name: Run unit tests and assemble APK
        run: >-
          ./gradlew
          :core-model:test
          :loop:test
          :triage:test
          :export:test
          :connectors:testDebugUnitTest
          :core-data:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          --stacktrace
          --no-daemon

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Run license gate
        run: ./gradlew licenseCheck --stacktrace --no-daemon

      - name: Commit readable verified source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Assay private dogfood V1"
          git push origin HEAD:agent/cs-app-v1

      - name: Upload verified APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: assay-v1-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            **/build/test-results/**
          if-no-files-found: error
