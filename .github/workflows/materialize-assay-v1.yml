name: Materialize Assay V1

on:
  push:
    branches:
      - agent/assay-v1-final
    paths:
      - .github/workflows/materialize-assay-v1.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-assay-v1-final
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out clean final branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Recover and materialize verified V1 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/finish-csapp-v1:refs/remotes/origin/agent/finish-csapp-v1
          mapfile -t parts < <(git ls-tree -r --name-only origin/agent/finish-csapp-v1 bootstrap-v1 | sort)
          test "${#parts[@]}" -eq 8
          for part in "${parts[@]}"; do
            git show "origin/agent/finish-csapp-v1:${part}"
          done | base64 --decode > /tmp/assay-v1-source.tar.xz
          echo "3c74a22517f03d140c8d2487a1cf877d6a312008452483b4d95c56696d0a3845  /tmp/assay-v1-source.tar.xz" | sha256sum --check --strict
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/assay-v1-source.tar.xz -C .
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
          python3 tools/verify_source.py

      - name: Publish normal readable source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Assay V1"
          git push origin HEAD:agent/assay-v1-final

      - name: Compile, test, and assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :core-model:test \
            :loop:test \
            :triage:test \
            :export:test \
            :connectors:testDebugUnitTest \
            :core-data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --stacktrace

      - name: Run Android lint
        shell: bash
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: assay-v1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
