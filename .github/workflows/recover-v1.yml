name: Recover and verify V1

on:
  push:
    branches:
      - agent/private-dogfood-v1
    paths:
      - .github/workflows/recover-v1.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csapp-private-dogfood-v1-recovery
  cancel-in-progress: false

jobs:
  recover-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Recover verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/finish-csapp-v1:refs/remotes/origin/agent/finish-csapp-v1
          for part in part-00 part-01 part-02 part-03 part-04 part-05 part-06 part-07; do
            git show "origin/agent/finish-csapp-v1:bootstrap-v1/${part}"
          done | base64 --decode > /tmp/csapp-v1-source.tar.xz
          echo "3c74a22517f03d140c8d2487a1cf877d6a312008452483b4d95c56696d0a3845  /tmp/csapp-v1-source.tar.xz" | sha256sum --check --strict
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/csapp-v1-source.tar.xz -C .

      - name: Apply known compile corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          patches = [
              (Path("app/src/main/kotlin/dev/fonebrew/cs/MainActivity.kt"), "import androidx.lifecycle.viewModels\n", "import androidx.lifecycle.viewModels\nimport androidx.lifecycle.lifecycleScope\n"),
              (Path("app/src/main/kotlin/dev/fonebrew/cs/WorkScheduling.kt"), "import java.util.concurrent.TimeUnit\n", "import java.util.concurrent.TimeUnit\nimport kotlinx.coroutines.launch\n"),
              (Path("app/src/test/kotlin/dev/fonebrew/cs/CoordinatorInvariantTest.kt"), "import dev.fonebrew.cs.triage.TriageService\n", "import dev.fonebrew.cs.triage.TriageService\nimport kotlinx.coroutines.flow.first\n"),
          ]
          for path, needle, replacement in patches:
              text = path.read_text()
              if replacement not in text:
                  if needle not in text:
                      raise SystemExit(f"Expected import anchor not found in {path}")
                  path.write_text(text.replace(needle, replacement, 1))
          PY
          rm -rf bootstrap bootstrap-code bootstrap-v1
          rm -f source.tar.gz bootstrap.part-* bootstrap.payload.*
          rm -f .github/workflows/bootstrap-v1.yml .github/workflows/recover-v1.yml .github/workflows/materialize-pr.yml
          chmod +x gradlew 2>/dev/null || true
          python3 tools/verify_source.py

      - name: Publish readable source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build private dogfood V1"
          git push origin HEAD:agent/private-dogfood-v1

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          gradle --no-daemon \
            :core-model:test \
            :loop:test \
            :triage:test \
            :export:test \
            :connectors:testDebugUnitTest \
            :core-data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --stacktrace 2>&1 | tee build/gradle-build.log

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug --stacktrace 2>&1 | tee build/gradle-lint.log

      - name: Generate pinned Gradle wrapper
        if: success()
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Publish Gradle wrapper
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add gradlew gradlew.bat gradle/wrapper
          if ! git diff --cached --quiet; then
            git commit -m "build: add pinned Gradle wrapper"
            git push origin HEAD:agent/private-dogfood-v1
          fi

      - name: Runtime dependency report
        if: always()
        shell: bash
        run: gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > build/runtime-dependencies.txt 2>&1 || true

      - name: Upload V1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csapp-private-dogfood-v1
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/reports/**
            build/gradle-build.log
            build/gradle-lint.log
            build/runtime-dependencies.txt
          if-no-files-found: warn
